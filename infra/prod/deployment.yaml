apiVersion: v1
kind: Namespace
metadata:
  name: tasks-api-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasks-api
  namespace: tasks-api-prod
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api
  namespace: tasks-api-prod
  labels:
    app: tasks-api
    env: prod
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tasks-api
  template:
    metadata:
      labels:
        app: tasks-api
        env: prod
    spec:
      serviceAccountName: tasks-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-regcred          # created with: kubectl create secret docker-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tasks-api
          image: IMAGE_PLACEHOLDER      # replaced by the Jenkins deploy stage
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: "prod"
            - name: LOG_LEVEL
              value: "WARNING"
            # Real secrets (e.g. DATABASE_URL) come from a Secret, never from this file:
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef: { name: tasks-api-db, key: url }
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp           # writable scratch space (SQLite file in dev)
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-api
  namespace: tasks-api-prod
spec:
  type: ClusterIP
  selector:
    app: tasks-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tasks-api
  namespace: tasks-api-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tasks-api
